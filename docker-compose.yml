services:
  mongo:
    image: mongo:latest
    container_name: aeroroute-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeroroute-web
    restart: always
    ports:
      - "8080:80"
    environment:
      - ConnectionStrings__MongoDB=mongodb://mongo:27017
      - MongoDbSettings__DatabaseName=DroneDeliveryDb
      - MongoDbSettings__CollectionName=DeliveryPlans
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
